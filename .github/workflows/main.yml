name: NEET Scraper 3X Speed
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        subject: [Biology, Chemistry, Physics]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup JQ
        run: sudo apt-get install jq -y

      - name: Run Scraper for ${{ matrix.subject }}
        run: |
          chmod +x scrape.sh
          ./scrape.sh ${{ matrix.subject }}

      - name: Smart Sync and Push
        run: |
          git config --global user.name "ScraperBot"
          git config --global user.email "bot@trackprep.sync"
          
          # Loop to handle push conflicts between Bio/Phy/Chem jobs
          for i in {1..5}; do
            git add data/
            git stash
            git pull --rebase origin main
            git stash pop || echo "No changes to unstash"
            git add data/
            git commit -m "Sync ${{ matrix.subject }}: $(date)" || break
            if git push origin main; then
              echo "Push successful!"
              break
            else
              echo "Push failed, retrying in 10s..."
              sleep 10
            fi
          done
