      - name: Commit and Push
        run: |
          git config --global user.name "ScraperBot"
          git config --global user.email "bot@trackprep.sync"
          
          # 1. Stage changes first
          git add data/
          
          # 2. Fetch and Rebase to handle parallel runs from other subjects
          git fetch origin main
          git pull --rebase origin main
          
          # 3. Commit and Push
          git commit -m "Sync ${{ matrix.subject }}: $(date)" || echo "No changes"
          git push origin main
